name: chronicler-mcp
description: >
  MCP server that transcribes voice recordings via Groq Whisper and retells them
  as narrated chronicles in medieval, sports, nature, or fantasy style, producing
  both chronicle text and a base64-encoded MP3 audio file.
version: 0.1.0

build:
  dockerfile: null
  command: pnpm --filter mcp exec tsx src/index.ts

startCommand:
  type: stdio
  command: pnpm --filter mcp exec tsx src/index.ts
  env:
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    GROQ_API_KEY: ${GROQ_API_KEY}

config:
  - name: OPENROUTER_API_KEY
    description: OpenRouter API key used for LLM chronicle generation (required)
    required: true
    secret: true
  - name: GROQ_API_KEY
    description: Groq API key used for Whisper audio transcription (required)
    required: true
    secret: true
  - name: MCP_API_KEY
    description: Optional bearer token to protect the MCP endpoint in remote deployments
    required: false
    secret: true

tools:
  - name: voice_to_chronicle
    description: >
      Full pipeline in one call: transcribes a voice recording (base64-encoded audio),
      then rewrites it as a narrated chronicle in the chosen flavour. Returns the
      transcript, the chronicle text, and a base64-encoded MP3 audio file.
    inputSchema:
      type: object
      properties:
        audio_base64:
          type: string
          description: Base64-encoded audio file content
        filename:
          type: string
          description: Original filename including extension (e.g. recording.mp3). Used to detect audio format.
        flavour:
          type: string
          enum: [medieval, sports, nature, fantasy]
          description: "Narrative style: medieval, sports, nature, or fantasy"
        speaker:
          type: string
          description: Name or label for the person who recorded this. Defaults to "Narrator".
      required: [audio_base64, filename, flavour]

  - name: transcribe_voice
    description: >
      Transcribe a voice recording into text using Groq Whisper.
      Returns the transcript and how long transcription took.
    inputSchema:
      type: object
      properties:
        audio_base64:
          type: string
          description: Base64-encoded audio file content
        filename:
          type: string
          description: Original filename including extension (e.g. recording.mp3). Used to detect audio format.
      required: [audio_base64, filename]

  - name: generate_chronicle
    description: >
      Rewrite one or more voice transcripts as a narrated chronicle in a chosen
      flavour (medieval, sports, nature, fantasy). Returns the chronicle text and
      a base64-encoded MP3 audio file.
    inputSchema:
      type: object
      properties:
        transcripts:
          type: array
          description: One or more transcripts to merge into a single chronicle.
          items:
            type: object
            properties:
              speaker:
                type: string
                description: Name or label for this contributor
              text:
                type: string
                description: The transcript text
            required: [speaker, text]
          minItems: 1
        flavour:
          type: string
          enum: [medieval, sports, nature, fantasy]
          description: "Narrative style: medieval, sports, nature, or fantasy"
      required: [transcripts, flavour]
